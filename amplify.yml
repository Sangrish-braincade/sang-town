version: 1
frontend:
  phases:
    preBuild:
      commands:
        # npm install (not ci): the Windows-generated lockfile omits Rolldown's
        # linux-x64 native binary; install re-resolves it for the build platform.
        - npm install --no-audit --no-fund
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
