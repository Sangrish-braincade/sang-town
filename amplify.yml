version: 1
frontend:
  phases:
    preBuild:
      commands:
        # The Windows-generated package-lock omits Rolldown's linux-x64 native
        # binary (npm optional-deps bug #4828). Drop the lockfile so npm
        # re-resolves the correct platform binary on the Linux build host.
        - rm -f package-lock.json
        - npm install --no-audit --no-fund
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
