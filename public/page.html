<script type="text/babel" data-presets="react">
// =============================================================
// HERO TERMINAL — interactive Mac-style terminal (replaces orb)
// =============================================================
(function () {
  const COMMANDS = {
    help: () => ([
      { c:'#3df58c', t:'available commands' },
      { c:'rgba(237,227,210,.85)', t:'  whoami       — who am i' },
      { c:'rgba(237,227,210,.85)', t:'  skills       — what i ship with' },
      { c:'rgba(237,227,210,.85)', t:'  papers       — research output' },
      { c:'rgba(237,227,210,.85)', t:'  now          — what i\'m on this week' },
      { c:'rgba(237,227,210,.85)', t:'  contact      — say hi' },
      { c:'rgba(237,227,210,.85)', t:'  clear        — clear screen' },
      { c:'rgba(237,227,210,.5)',  t:'  ↑/↓ history  · tab autocomplete' },
    ]),
    whoami: () => ([
      { c:'#EDE3D2', t:'sang.' },
      { c:'rgba(237,227,210,.85)', t:'co-founder & cto · aicade   (text → game, eng 7→20)' },
      { c:'rgba(237,227,210,.85)', t:'founder · pulstra           (ai/ml consultancy, 3 active)' },
      { c:'rgba(237,227,210,.85)', t:'building · zeno             (claude desktop companion)' },
      { c:'#3df58c',               t:'status: available · uk msc sep 2026' },
    ]),
    skills: () => ([
      { c:'#FF5B22', t:'inference & efficient ml' },
      { c:'rgba(237,227,210,.85)', t:'  GQA · KV-cache eviction · long-context · quantisation' },
      { c:'#FF5B22', t:'systems' },
      { c:'rgba(237,227,210,.85)', t:'  pytorch · triton · cuda glue · mcp · flask · azure' },
      { c:'#FF5B22', t:'product' },
      { c:'rgba(237,227,210,.85)', t:'  zero→one · hiring · architecture · shipping over benching' },
    ]),
    papers: () => ([
      { c:'#3df58c', t:'[preprint] simpler is better: GQA-aware kv eviction' },
      { c:'rgba(237,227,210,.7)', t:'  beats H2O at every kv budget · arXiv 2026' },
      { c:'#3df58c', t:'[published] ship-hull paper · results in engineering · IF 9.20' },
      { c:'#fff5a0', t:'[in-review] squat biomechanics · with prof davidson' },
    ]),
    now: () => ([
      { c:'#FF5B22', t:'▸ pivoting zeno → claude desktop mcp companion-window' },
      { c:'#FF5B22', t:'▸ "simpler is better" KV paper → arXiv this week' },
      { c:'#FF5B22', t:'▸ uk msc applications, sep 2026 entry' },
      { c:'#FF5B22', t:'▸ pulstra: satoshi · omniactive · visteon' },
    ]),
    contact: () => ([
      { c:'#EDE3D2', t:'sangrish03@gmail.com' },
      { c:'rgba(237,227,210,.7)', t:'github  · github.com/sangrish-braincade' },
      { c:'rgba(237,227,210,.7)', t:'x       · @Sangrish03' },
      { c:'rgba(237,227,210,.7)', t:'linkedin· linkedin.com/in/sangrish' },
      { c:'#3df58c', t:'opening mail client…' },
      { c:'__action', t:'mail' },
    ]),
    clear: () => ([{ c:'__action', t:'clear' }]),
    sudo: () => ([{ c:'#FF5B22', t:'permission denied: nice try.' }]),
    ls: () => ([{ c:'rgba(237,227,210,.85)', t:'about.md  papers/  projects/  workshop/  .secrets' }]),
  };
  const SUGGESTIONS = ['whoami','skills','papers','now','contact','help','clear'];

  window.HeroTerminal = function HeroTerminal({ onWorkshop }) {
    const [history, setHistory] = React.useState([]);
    const [input, setInput] = React.useState('');
    const [cmdHistory, setCmdHistory] = React.useState([]);
    const [histIdx, setHistIdx] = React.useState(-1);
    const [focused, setFocused] = React.useState(false);
    const [booted, setBooted] = React.useState(false);
    const inputRef = React.useRef(null);
    const scrollRef = React.useRef(null);
    const bootedOnce = React.useRef(false);

    React.useEffect(() => {
      if (bootedOnce.current) return;
      bootedOnce.current = true;
      const seq = [
        { c:'rgba(237,227,210,.5)', t:'sang@workshop ── arch linux 6.8 · zsh' },
        { c:'rgba(237,227,210,.5)', t:'last login: just now · from /' },
        { c:'#3df58c',               t:'welcome. type \'help\' or click a hint below.' },
      ];
      const timers = [];
      seq.forEach((line, i) => {
        timers.push(setTimeout(() => {
          setHistory(h => [...h, { kind:'out', lines:[line] }]);
        }, 400 + i * 320));
      });
      timers.push(setTimeout(() => setBooted(true), 400 + seq.length * 320));
      return () => timers.forEach(clearTimeout);
    }, []);

    React.useEffect(() => {
      if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }, [history]);

    const focus = () => inputRef.current && inputRef.current.focus();

    const run = (raw) => {
      const cmd = (raw || '').trim().toLowerCase();
      setHistory(h => [...h, { kind:'in', text: raw }]);
      if (!cmd) return;
      setCmdHistory(c => [...c, raw]); setHistIdx(-1);
      const fn = COMMANDS[cmd] || COMMANDS[cmd.split(' ')[0]];
      if (!fn) {
        setHistory(h => [...h, { kind:'out', lines:[
          { c:'#FF5B22', t:`command not found: ${cmd}` },
          { c:'rgba(237,227,210,.5)', t:'try: help' },
        ]}]);
        return;
      }
      const lines = fn();
      const visible = [];
      lines.forEach(l => {
        if (l.c === '__action') {
          if (l.t === 'clear') setHistory([]);
          else if (l.t === 'mail') setTimeout(() => { window.location.href = 'mailto:sangrish03@gmail.com'; }, 500);
        } else { visible.push(l); }
      });
      if (visible.length) setHistory(h => [...h, { kind:'out', lines: visible }]);
    };

    const onKey = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); run(input); setInput(''); }
      else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (cmdHistory.length === 0) return;
        const ni = histIdx < 0 ? cmdHistory.length - 1 : Math.max(0, histIdx - 1);
        setHistIdx(ni); setInput(cmdHistory[ni] || '');
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (histIdx < 0) return;
        const ni = histIdx + 1;
        if (ni >= cmdHistory.length) { setHistIdx(-1); setInput(''); }
        else { setHistIdx(ni); setInput(cmdHistory[ni]); }
      } else if (e.key === 'Tab') {
        e.preventDefault();
        const m = SUGGESTIONS.find(s => s.startsWith(input.toLowerCase()));
        if (m) setInput(m);
      } else if (e.key === 'l' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault(); setHistory([]);
      }
    };

    return (
      <div onClick={focus} style={{
        width:'100%', maxWidth:560,
        background:'rgba(7,6,5,.92)',
        border: focused ? '1px solid rgba(255,91,34,.35)' : '1px solid rgba(237,227,210,.18)',
        borderRadius:8, overflow:'hidden',
        backdropFilter:'blur(8px) saturate(1.1)',
        boxShadow:'0 40px 90px -30px rgba(0,0,0,.7), 0 0 0 1px rgba(255,91,34,.08), inset 0 1px 0 rgba(237,227,210,.06)',
        fontFamily:'"JetBrains Mono",monospace',
        cursor:'text', transition:'box-shadow .3s, border-color .3s',
      }}>
        <div style={{
          display:'flex', alignItems:'center', gap:8,
          padding:'10px 14px',
          background:'linear-gradient(180deg, rgba(237,227,210,.06), rgba(237,227,210,.02))',
          borderBottom:'1px solid rgba(237,227,210,.1)',
        }}>
          <span style={{ width:11, height:11, borderRadius:'50%', background:'#FF5B47', boxShadow:'inset 0 0 0 1px rgba(0,0,0,.2)' }} />
          <span style={{ width:11, height:11, borderRadius:'50%', background:'#FFBD2E', boxShadow:'inset 0 0 0 1px rgba(0,0,0,.2)' }} />
          <span style={{ width:11, height:11, borderRadius:'50%', background:'#28C940', boxShadow:'inset 0 0 0 1px rgba(0,0,0,.2)' }} />
          <span style={{ marginLeft:14, fontSize:10.5, letterSpacing:1.8, color:'rgba(237,227,210,.55)' }}>sang@workshop ── ~/intro</span>
          <span style={{ marginLeft:'auto', fontSize:9, letterSpacing:1.5, color:'rgba(61,245,140,.7)' }}>● live</span>
        </div>
        <div ref={scrollRef} style={{
          padding:'16px 18px 8px',
          fontSize:12.5, lineHeight:1.7,
          height:360, overflowY:'auto', scrollBehavior:'smooth',
        }}>
          {history.map((h, i) => h.kind === 'in' ? (
            <div key={i} style={{ color:'rgba(237,227,210,.95)', whiteSpace:'pre' }}>
              <span style={{ color:'#3df58c', marginRight:8 }}>➜</span>
              <span style={{ color:'#FF5B22', marginRight:8 }}>~/intro</span>
              {h.text}
            </div>
          ) : (
            <div key={i} style={{ marginBottom:6 }}>
              {(h.lines || []).filter(Boolean).map((l, j) => (
                <div key={j} style={{ color:l.c, whiteSpace:'pre' }}>{l.t}</div>
              ))}
            </div>
          ))}
          {booted && (
            <div style={{ display:'flex', alignItems:'baseline', color:'rgba(237,227,210,.95)', whiteSpace:'pre' }}>
              <span style={{ color:'#3df58c', marginRight:8 }}>➜</span>
              <span style={{ color:'#FF5B22', marginRight:8 }}>~/intro</span>
              <span style={{ position:'relative', flex:1 }}>
                <span>{input}</span>
                <span style={{
                  display:'inline-block', width:7, height:13, marginLeft:1,
                  background:'#EDE3D2', verticalAlign:'-1px',
                  animation:'blinkH 1.05s steps(2) infinite',
                }} />
                <input
                  ref={inputRef}
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={onKey}
                  onFocus={() => setFocused(true)}
                  onBlur={() => setFocused(false)}
                  spellCheck={false}
                  autoCapitalize="off"
                  autoComplete="off"
                  style={{
                    position:'absolute', inset:0, opacity:0,
                    background:'transparent', border:'none', outline:'none',
                    color:'transparent', caretColor:'transparent',
                    fontFamily:'inherit', fontSize:'inherit',
                  }}
                />
              </span>
            </div>
          )}
          <style>{`@keyframes blinkH{50%{opacity:0}}`}</style>
        </div>
        <div style={{
          padding:'10px 14px',
          borderTop:'1px solid rgba(237,227,210,.08)',
          display:'flex', gap:6, flexWrap:'wrap',
          background:'rgba(237,227,210,.02)',
        }}>
          {['whoami','skills','papers','now'].map(c => (
            <button key={c}
              onClick={(e) => { e.stopPropagation(); run(c); focus(); }}
              style={{
                background:'transparent',
                border:'1px solid rgba(237,227,210,.14)',
                color:'rgba(237,227,210,.7)',
                fontFamily:'inherit', fontSize:10, letterSpacing:1.2,
                padding:'4px 9px', cursor:'pointer',
                borderRadius:3, transition:'all .15s',
              }}
              onMouseEnter={(e) => { e.currentTarget.style.borderColor='#FF5B22'; e.currentTarget.style.color='#FF5B22'; }}
              onMouseLeave={(e) => { e.currentTarget.style.borderColor='rgba(237,227,210,.14)'; e.currentTarget.style.color='rgba(237,227,210,.7)'; }}
            >{c}</button>
          ))}
        </div>
      </div>
    );
  };
})();

// =============================================================
// (legacy HeroOrb removed — its orbiting tag labels overlapped hero text)
// =============================================================
(function() { /* placeholder block kept for symmetry; HeroOrb retired. */
  window.HeroOrb_LEGACY = function HeroOrb({ size = 480, tags = ['ZENO','AICADE','PULSTRA','ZAQEN'] }) {
    const mountRef = React.useRef(null);
    const stateRef = React.useRef({ mx: 0, my: 0 });

    React.useEffect(() => {
      let alive = true; let raf = 0; let cleanup = () => {};
      loadThree().then((THREE) => {
        if (!alive || !mountRef.current) return;
        const mount = mountRef.current;
        const W = mount.clientWidth, H = mount.clientHeight;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
        camera.position.set(0, 0, 7);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(W, H);
        renderer.setClearColor(0x000000, 0);
        mount.appendChild(renderer.domElement);

        const ICO_R = 1.85;
        const icoGeom = new THREE.IcosahedronGeometry(ICO_R, 1);
        const icoEdges = new THREE.EdgesGeometry(icoGeom);
        const icoLines = new THREE.LineSegments(
          icoEdges,
          new THREE.LineBasicMaterial({ color: 0xEDE3D2, transparent: true, opacity: 0.85 })
        );
        scene.add(icoLines);

        const icoSolid = new THREE.Mesh(
          icoGeom,
          new THREE.MeshBasicMaterial({ color: 0x0F0E0C, transparent: true, opacity: 0.92 })
        );
        icoSolid.scale.setScalar(0.985);
        scene.add(icoSolid);

        const vertGeom = new THREE.BufferGeometry();
        const positions = icoGeom.attributes.position.array;
        const uniqueVerts = [];
        const seen = new Set();
        for (let i = 0; i < positions.length; i += 3) {
          const k = `${positions[i].toFixed(3)},${positions[i+1].toFixed(3)},${positions[i+2].toFixed(3)}`;
          if (!seen.has(k)) { seen.add(k); uniqueVerts.push(positions[i], positions[i+1], positions[i+2]); }
        }
        vertGeom.setAttribute('position', new THREE.Float32BufferAttribute(uniqueVerts, 3));
        const vertDots = new THREE.Points(
          vertGeom,
          new THREE.PointsMaterial({ color: 0xFF5B22, size: 0.09, transparent: true, opacity: 0.95 })
        );
        scene.add(vertDots);

        const ringR = 3.0;
        const ringSegs = 96;
        const ringPts = [];
        for (let i = 0; i <= ringSegs; i++) {
          const a = (i / ringSegs) * Math.PI * 2;
          ringPts.push(new THREE.Vector3(Math.cos(a) * ringR, 0, Math.sin(a) * ringR));
        }
        const ringGeom = new THREE.BufferGeometry().setFromPoints(ringPts);
        const ring = new THREE.Line(ringGeom, new THREE.LineBasicMaterial({ color: 0xEDE3D2, transparent: true, opacity: 0.18 }));
        ring.rotation.x = Math.PI * 0.32; ring.rotation.z = -0.18;
        scene.add(ring);

        const ringR2 = 2.45;
        const ringPts2 = [];
        for (let i = 0; i <= ringSegs; i++) {
          const a = (i / ringSegs) * Math.PI * 2;
          ringPts2.push(new THREE.Vector3(Math.cos(a) * ringR2, 0, Math.sin(a) * ringR2));
        }
        const ring2 = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(ringPts2),
          new THREE.LineBasicMaterial({ color: 0xFF5B22, transparent: true, opacity: 0.22 })
        );
        ring2.rotation.x = Math.PI * 0.24; ring2.rotation.z = 0.42;
        scene.add(ring2);

        const sats = [];
        const tagCount = Math.min(tags.length, 4);
        for (let i = 0; i < tagCount; i++) {
          const grp = new THREE.Group();
          const cubeGeom = new THREE.BoxGeometry(0.18, 0.18, 0.18);
          const cube = new THREE.Mesh(cubeGeom, new THREE.MeshBasicMaterial({ color: 0xFF5B22 }));
          const cubeWire = new THREE.LineSegments(
            new THREE.EdgesGeometry(cubeGeom),
            new THREE.LineBasicMaterial({ color: 0xEDE3D2, transparent: true, opacity: 0.9 })
          );
          cube.add(cubeWire);
          grp.add(cube);
          scene.add(grp);
          sats.push({ grp, phase: (i / tagCount) * Math.PI * 2, ringTilt: i % 2 === 0 ? ring : ring2 });
        }

        const dustCount = 90;
        const dustPos = new Float32Array(dustCount * 3);
        for (let i = 0; i < dustCount; i++) {
          const r = 4 + Math.random() * 2.5;
          const t = Math.random() * Math.PI * 2;
          const p = (Math.random() - 0.5) * Math.PI;
          dustPos[i*3]   = Math.cos(t) * Math.cos(p) * r;
          dustPos[i*3+1] = Math.sin(p) * r;
          dustPos[i*3+2] = Math.sin(t) * Math.cos(p) * r;
        }
        const dustGeom = new THREE.BufferGeometry();
        dustGeom.setAttribute('position', new THREE.Float32BufferAttribute(dustPos, 3));
        const dust = new THREE.Points(
          dustGeom,
          new THREE.PointsMaterial({ color: 0xEDE3D2, size: 0.025, transparent: true, opacity: 0.4 })
        );
        scene.add(dust);

        const labelEls = [];
        for (let i = 0; i < tagCount; i++) {
          const el = document.createElement('div');
          el.textContent = tags[i];
          el.style.cssText = `
            position:absolute; pointer-events:none;
            font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:1.5px;
            color:#EDE3D2; background:rgba(15,14,12,.78);
            border:1px solid rgba(255,91,34,.6);
            padding:3px 7px; transform:translate(-50%,-50%);
            white-space:nowrap; text-transform:uppercase;
            backdrop-filter: blur(3px);
            transition:opacity .3s;
          `;
          mount.appendChild(el);
          labelEls.push(el);
        }

        const onMove = (e) => {
          const rect = mount.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          stateRef.current.mx = (e.clientX - cx) / rect.width;
          stateRef.current.my = (e.clientY - cy) / rect.height;
        };
        window.addEventListener('mousemove', onMove);

        const onResize = () => {
          if (!mount) return;
          const w = mount.clientWidth, h = mount.clientHeight;
          camera.aspect = w / h; camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', onResize);

        const v3 = new THREE.Vector3();
        const start = performance.now();

        const tick = () => {
          if (!alive) return;
          const t = (performance.now() - start) / 1000;
          const { mx, my } = stateRef.current;

          const targetRotY = t * 0.18 + mx * 0.6;
          const targetRotX = -0.22 + my * 0.35;
          icoLines.rotation.y += (targetRotY - icoLines.rotation.y) * 0.08;
          icoLines.rotation.x += (targetRotX - icoLines.rotation.x) * 0.08;
          icoSolid.rotation.copy(icoLines.rotation);
          vertDots.rotation.copy(icoLines.rotation);

          ring.rotation.y = -t * 0.12;
          ring2.rotation.y = t * 0.18;

          sats.forEach((s, i) => {
            const ringRef = s.ringTilt;
            const r = i % 2 === 0 ? ringR : ringR2;
            const a = s.phase + t * (i % 2 === 0 ? 0.45 : -0.55);
            v3.set(Math.cos(a) * r, 0, Math.sin(a) * r);
            v3.applyEuler(ringRef.rotation);
            s.grp.position.copy(v3);
            s.grp.rotation.x = t * 1.2 + i;
            s.grp.rotation.y = t * 1.5 + i;

            const screen = v3.clone().project(camera);
            const x = (screen.x * 0.5 + 0.5) * mount.clientWidth;
            const y = (-screen.y * 0.5 + 0.5) * mount.clientHeight;
            const el = labelEls[i];
            if (el) {
              el.style.left = x + 'px';
              el.style.top  = (y - 22) + 'px';
              el.style.opacity = screen.z < 1 ? '1' : '0.25';
            }
          });

          dust.rotation.y = t * 0.04;
          dust.rotation.x = t * 0.02;

          renderer.render(scene, camera);
          raf = requestAnimationFrame(tick);
        };
        tick();

        cleanup = () => {
          cancelAnimationFrame(raf);
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('resize', onResize);
          labelEls.forEach(el => el.remove());
          renderer.dispose();
          if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
          icoGeom.dispose(); icoEdges.dispose(); vertGeom.dispose();
        };
      });

      return () => { alive = false; cleanup(); };
    }, []);

    return (
      <div ref={mountRef} style={{
        position:'relative', width:'100%', aspectRatio:'1 / 1', maxWidth:size,
        marginLeft:'auto',
      }} />
    );
  };
})();

// =============================================================
// SCROLL SCENE — full-page scroll-driven 3D backdrop
// =============================================================
(function() {
  const THREE_URL = 'https://unpkg.com/three@0.160.0/build/three.min.js';
  function loadThree() {
    return new Promise((resolve) => {
      if (window.THREE) return resolve(window.THREE);
      const s = document.createElement('script');
      s.src = THREE_URL;
      s.onload = () => resolve(window.THREE);
      document.head.appendChild(s);
    });
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const range = (p, a, b) => clamp((p - a) / (b - a));
  const fade = (p, a, b, c, d) => {
    if (p < a || p > d) return 0;
    if (p < b) return range(p, a, b);
    if (p > c) return 1 - range(p, c, d);
    return 1;
  };

  window.ScrollScene = function ScrollScene() {
    const mountRef = React.useRef(null);
    const stateRef = React.useRef({ progress: 0, mx: 0, my: 0 });
    React.useEffect(() => {
      let alive = true; let raf = 0; let cleanup = () => {};
      loadThree().then((THREE) => {
        if (!alive || !mountRef.current) return;
        const mount = mountRef.current;
        const W = window.innerWidth, H = window.innerHeight;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, W / H, 0.1, 200);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(W, H);
        renderer.setClearColor(0x000000, 0);
        mount.appendChild(renderer.domElement);
        const C = { cream: 0xEDE3D2, ink: 0x0F0E0C, vermillion: 0xFF5B22, green: 0x3df58c };

        // CH0 hero core
        const heroGroup = new THREE.Group();
        const icoGeom = new THREE.IcosahedronGeometry(1.6, 1);
        const icoEdges = new THREE.EdgesGeometry(icoGeom);
        const icoLines = new THREE.LineSegments(icoEdges, new THREE.LineBasicMaterial({ color: C.cream, transparent: true, opacity: 0.85 }));
        const icoSolid = new THREE.Mesh(icoGeom, new THREE.MeshBasicMaterial({ color: C.ink, transparent: true, opacity: 0.92 }));
        icoSolid.scale.setScalar(0.985);
        heroGroup.add(icoSolid, icoLines);
        const seen = new Set(); const uniq = [];
        const arr = icoGeom.attributes.position.array;
        for (let i = 0; i < arr.length; i += 3) {
          const k = `${arr[i].toFixed(3)},${arr[i+1].toFixed(3)},${arr[i+2].toFixed(3)}`;
          if (!seen.has(k)) { seen.add(k); uniq.push(arr[i], arr[i+1], arr[i+2]); }
        }
        const vGeom = new THREE.BufferGeometry();
        vGeom.setAttribute('position', new THREE.Float32BufferAttribute(uniq, 3));
        const vDots = new THREE.Points(vGeom, new THREE.PointsMaterial({ color: C.vermillion, size: 0.085 }));
        heroGroup.add(vDots);
        const ringPts = [];
        for (let i = 0; i <= 96; i++) {
          const a = (i / 96) * Math.PI * 2;
          ringPts.push(new THREE.Vector3(Math.cos(a) * 2.6, 0, Math.sin(a) * 2.6));
        }
        const ring = new THREE.Line(new THREE.BufferGeometry().setFromPoints(ringPts), new THREE.LineBasicMaterial({ color: C.vermillion, transparent: true, opacity: 0.3 }));
        ring.rotation.x = Math.PI * 0.32; ring.rotation.z = -0.18;
        heroGroup.add(ring);
        scene.add(heroGroup);

        // CH1 work constellation
        const constGroup = new THREE.Group();
        const NODES = [
          { name:'AICADE',  pos:new THREE.Vector3(-3.2,  1.4,  0.5) },
          { name:'ZENO',    pos:new THREE.Vector3( 3.0,  0.8, -1.2) },
          { name:'ZAQEN',   pos:new THREE.Vector3(-1.6, -1.6, -2.2) },
          { name:'PULSTRA', pos:new THREE.Vector3( 1.8, -1.0,  1.8) },
        ];
        const nodeMeshes = [];
        NODES.forEach((n, i) => {
          const cubeG = new THREE.BoxGeometry(0.55, 0.55, 0.55);
          const cube = new THREE.Mesh(cubeG, new THREE.MeshBasicMaterial({ color: C.ink, transparent:true, opacity:0.85 }));
          const wire = new THREE.LineSegments(new THREE.EdgesGeometry(cubeG), new THREE.LineBasicMaterial({ color: C.cream, transparent:true, opacity:0.95 }));
          cube.add(wire);
          cube.position.copy(n.pos);
          constGroup.add(cube);
          nodeMeshes.push({ cube, wire });
        });
        const edgePts = [];
        for (let i = 0; i < NODES.length; i++) for (let j = i+1; j < NODES.length; j++) {
          edgePts.push(NODES[i].pos.clone(), NODES[j].pos.clone());
        }
        const edgeLines = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(edgePts), new THREE.LineBasicMaterial({ color: C.vermillion, transparent: true, opacity: 0.18 }));
        constGroup.add(edgeLines);
        constGroup.position.set(0, 0, -8);
        constGroup.visible = false;
        scene.add(constGroup);

        // CH2 KV-cache grid — pinned to right side of viewport (tall narrow column)
        const kvGroup = new THREE.Group();
        const ROWS = 14, COLS = 6, BS = 0.28, GAP = 0.06;
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const evicted = Math.random() < 0.35;
            const g = new THREE.BoxGeometry(BS, BS, BS * 0.4);
            const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: evicted ? C.ink : C.cream, transparent: true, opacity: evicted ? 0.25 : 0.9 }));
            const w = new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: evicted ? C.cream : C.vermillion, transparent: true, opacity: evicted ? 0.3 : 0.9 }));
            m.add(w);
            m.position.set((c - COLS / 2) * (BS + GAP), (r - ROWS / 2) * (BS + GAP) * 1.3, 0);
            kvGroup.add(m);
          }
        }
        kvGroup.position.set(2.5, 0, -16);
        kvGroup.visible = false;
        scene.add(kvGroup);

        // CH4 timeline rail
        const railGroup = new THREE.Group();
        const railLen = 30;
        const railGeom = new THREE.BoxGeometry(0.08, 0.08, railLen);
        const rail = new THREE.Mesh(railGeom, new THREE.MeshBasicMaterial({ color: C.vermillion, transparent: true, opacity: 0.9 }));
        railGroup.add(rail);
        const YEARS = ['2020','2021','2022','2023','2024','2025','2026'];
        YEARS.forEach((y, i) => {
          const z = -railLen / 2 + (i / (YEARS.length - 1)) * railLen;
          const tickG = new THREE.BoxGeometry(0.04, 0.5, 0.04);
          const tick = new THREE.Mesh(tickG, new THREE.MeshBasicMaterial({ color: C.cream }));
          tick.position.set(0, 0, z);
          railGroup.add(tick);
        });
        railGroup.position.set(0, 0, -28);
        railGroup.visible = false;
        scene.add(railGroup);

        // CH5 stars
        const starsCount = 220;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
          const r = 12 + Math.random() * 8;
          const t = Math.random() * Math.PI * 2;
          const p = (Math.random() - 0.3) * Math.PI;
          starsPos[i*3]   = Math.cos(t) * Math.cos(p) * r;
          starsPos[i*3+1] = Math.sin(p) * r + 6;
          starsPos[i*3+2] = Math.sin(t) * Math.cos(p) * r - 36;
        }
        const starsG = new THREE.BufferGeometry();
        starsG.setAttribute('position', new THREE.Float32BufferAttribute(starsPos, 3));
        const stars = new THREE.Points(starsG, new THREE.PointsMaterial({ color: C.cream, size: 0.07, transparent:true, opacity: 0 }));
        scene.add(stars);

        // ambient dust
        const dustCount = 220;
        const dustPos = new Float32Array(dustCount * 3);
        for (let i = 0; i < dustCount; i++) {
          dustPos[i*3]   = (Math.random() - 0.5) * 30;
          dustPos[i*3+1] = (Math.random() - 0.5) * 20;
          dustPos[i*3+2] = -Math.random() * 40 + 5;
        }
        const dustG = new THREE.BufferGeometry();
        dustG.setAttribute('position', new THREE.Float32BufferAttribute(dustPos, 3));
        const dust = new THREE.Points(dustG, new THREE.PointsMaterial({ color: C.cream, size: 0.025, transparent: true, opacity: 0.35 }));
        scene.add(dust);

        const onScroll = () => {
          const max = document.documentElement.scrollHeight - window.innerHeight;
          stateRef.current.progress = max > 0 ? clamp(window.scrollY / max) : 0;
        };
        const onMove = (e) => {
          stateRef.current.mx = (e.clientX / window.innerWidth - 0.5);
          stateRef.current.my = (e.clientY / window.innerHeight - 0.5);
        };
        const onResize = () => {
          const w = window.innerWidth, h = window.innerHeight;
          camera.aspect = w / h; camera.updateProjectionMatrix();
          renderer.setSize(w, h);
          onScroll();
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('mousemove', onMove);
        window.addEventListener('resize', onResize);
        onScroll();

        const start = performance.now();
        const tick = () => {
          if (!alive) return;
          const t = (performance.now() - start) / 1000;
          const p = stateRef.current.progress;
          const { mx, my } = stateRef.current;
          const camZ = lerp(6.5, -34, p);
          const camY = lerp(0.2, 1.6 + my * 0.8, range(p, 0, 0.6)) + Math.sin(t * 0.4) * 0.05;
          const camX = mx * 0.6;
          camera.position.set(camX, camY, camZ);
          camera.lookAt(camX * 0.4, camY * 0.5, camZ - 4);

          const heroVis = fade(p, -0.05, 0.02, 0.10, 0.18);
          icoLines.material.opacity = 0.85 * heroVis;
          icoSolid.material.opacity = 0.92 * heroVis;
          vDots.material.opacity = 0.95 * heroVis;
          ring.material.opacity = 0.3 * heroVis;
          heroGroup.rotation.y = t * 0.18 + mx * 0.5;
          heroGroup.rotation.x = -0.22 + my * 0.3;

          const workVis = fade(p, 0.08, 0.14, 0.30, 0.36);
          constGroup.visible = workVis > 0.001;
          if (constGroup.visible) {
            constGroup.rotation.y = t * 0.08;
            nodeMeshes.forEach((nm, i) => {
              nm.cube.rotation.x = t * 0.6 + i;
              nm.cube.rotation.y = t * 0.4 + i;
              const pulse = 0.5 + 0.5 * Math.sin(t * 1.5 + i);
              nm.cube.material.opacity = (0.4 + 0.5 * pulse) * workVis;
              nm.wire.material.opacity = workVis * 0.95;
            });
            edgeLines.material.opacity = 0.22 * workVis;
          }

          const resVis = fade(p, 0.30, 0.36, 0.50, 0.56);
          kvGroup.visible = resVis > 0.001;
          if (kvGroup.visible) {
            kvGroup.rotation.x = -0.15 + my * 0.1;
            kvGroup.rotation.y = mx * 0.15;
            kvGroup.children.forEach((b, i) => {
              const wave = Math.sin(t * 1.4 + i * 0.3) * 0.05;
              b.position.z = wave;
              if (b.children[0]) b.children[0].material.opacity = resVis * 0.9;
              b.material.opacity = (b.material.color.getHex() === C.ink ? 0.25 : 0.9) * resVis;
            });
          }

          const expVis = fade(p, 0.58, 0.64, 0.78, 0.82);
          railGroup.visible = expVis > 0.001;
          if (railGroup.visible) {
            railGroup.children.forEach((c) => { if (c.material) c.material.opacity = expVis; });
            rail.material.transparent = true;
            rail.material.opacity = 0.9 * expVis;
          }

          const starsVis = fade(p, 0.74, 0.80, 1.0, 1.05);
          stars.material.opacity = 0.85 * starsVis;
          stars.rotation.y = t * 0.02;
          dust.rotation.y = t * 0.01;

          renderer.render(scene, camera);
          raf = requestAnimationFrame(tick);
        };
        tick();

        cleanup = () => {
          cancelAnimationFrame(raf);
          window.removeEventListener('scroll', onScroll);
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('resize', onResize);
          renderer.dispose();
          if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
        };
      });
      return () => { alive = false; cleanup(); };
    }, []);
    return <div ref={mountRef} style={{ position:'fixed', inset:0, zIndex:0, pointerEvents:'none' }} />;
  };

  // GlitchOverlay — scanlines, occasional RGB tear, vignette
  window.GlitchOverlay = function GlitchOverlay() {
    const [tear, setTear] = React.useState(false);
    React.useEffect(() => {
      let to;
      const loop = () => {
        const delay = 3000 + Math.random() * 6000;
        to = setTimeout(() => {
          setTear(true);
          setTimeout(() => setTear(false), 110 + Math.random() * 120);
          loop();
        }, delay);
      };
      loop();
      return () => clearTimeout(to);
    }, []);
    return (
      <>
        <style>{`
          @keyframes scanlines { 0% { background-position: 0 0; } 100% { background-position: 0 4px; } }
          @keyframes flicker { 0%, 96%, 100% { opacity: 1; } 97% { opacity: 0.85; } 98% { opacity: 1; } 99% { opacity: 0.92; } }
          .glitch-scan { position: fixed; inset: 0; pointer-events: none; z-index: 200; background-image: repeating-linear-gradient(0deg, rgba(255,91,34,0.03) 0px, rgba(255,91,34,0.03) 1px, transparent 1px, transparent 3px); mix-blend-mode: overlay; animation: scanlines 0.4s linear infinite; }
          .glitch-vignette { position: fixed; inset: 0; pointer-events: none; z-index: 199; background: radial-gradient(ellipse at center, transparent 50%, rgba(15,14,12,.65) 100%); animation: flicker 5s infinite; }
          .glitch-tear { position: fixed; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #FF5B22 30%, #3df58c 50%, #FF5B22 70%, transparent); opacity: 0.9; pointer-events: none; z-index: 201; mix-blend-mode: screen; }
          .glitch-noise { position: fixed; inset: 0; pointer-events: none; z-index: 198; opacity: 0.025; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>"); }
        `}</style>
        <div className="glitch-noise"></div>
        <div className="glitch-vignette"></div>
        <div className="glitch-scan"></div>
        {tear && (
          <>
            <div className="glitch-tear" style={{ top: `${Math.random()*100}%` }}></div>
            <div className="glitch-tear" style={{ top: `${Math.random()*100}%`, height: 1 }}></div>
          </>
        )}
      </>
    );
  };
})();

// KV DEMO — interactive perplexity comparison for "Simpler is Better"
// =============================================================
(function () {
  const POINTS = 21;
  const curveMean = (b) => { const x = b / 100; return 9.2 - 4.8 * Math.pow(x, 0.55) + 0.18 * Math.sin(x * 7); };
  const curveMax  = (b) => { const x = b / 100; return 8.7 - 5.0 * Math.pow(x, 0.6) + 0.10 * Math.sin(x * 7 + 1); };
  const curveFull = () => 4.62;

  window.KVDemo = function KVDemo() {
    const [budget, setBudget] = React.useState(35);
    const [model, setModel] = React.useState('Qwen2.5-3B');
    const ppMean = curveMean(budget);
    const ppMax = curveMax(budget);
    const ppFull = curveFull();
    const delta = (ppMean - ppMax).toFixed(3);

    const W = 560, H = 220, padL = 44, padR = 16, padT = 14, padB = 32;
    const xs = Array.from({ length: POINTS }, (_, i) => 5 + i * (95 / (POINTS - 1)));
    const ys1 = xs.map(b => curveMean(b));
    const ys2 = xs.map(b => curveMax(b));
    const yMin = 4.4, yMax = 9.5;
    const x = (b) => padL + ((b - 5) / 95) * (W - padL - padR);
    const y = (v) => padT + (1 - (v - yMin) / (yMax - yMin)) * (H - padT - padB);
    const path = (ys) => xs.map((b, i) => `${i === 0 ? 'M' : 'L'} ${x(b).toFixed(1)} ${y(ys[i]).toFixed(1)}`).join(' ');

    return (
      <div style={{
        border:'1px solid rgba(237,227,210,.14)', background:'rgba(237,227,210,.02)',
        padding:'28px 32px', marginTop:32, maxWidth:880, fontFamily:'"JetBrains Mono",monospace',
      }}>
        <div style={{ display:'flex', alignItems:'baseline', gap:14, flexWrap:'wrap', marginBottom:6 }}>
          <span style={{ fontSize:9, letterSpacing:2, color:'#FF5B22' }}>LIVE DEMO</span>
          <span style={{ fontSize:11, letterSpacing:1.5, color:'rgba(237,227,210,.5)' }}>simulation from paper · pg19 · ppl ↓ better</span>
        </div>
        <h4 style={{ margin:'2px 0 16px', fontFamily:'"Instrument Serif",serif', fontStyle:'italic', fontSize:30, color:'#EDE3D2', letterSpacing:-1, lineHeight:1.05 }}>
          drag the budget. watch max-aggregation hold the line.
        </h4>
        <div style={{ display:'flex', gap:20, flexWrap:'wrap', alignItems:'center', marginBottom:18 }}>
          <div style={{ flex:'1 1 280px', minWidth:240 }}>
            <div style={{ display:'flex', justifyContent:'space-between', fontSize:10.5, color:'rgba(237,227,210,.6)', letterSpacing:1.2 }}>
              <span>KV BUDGET</span>
              <span>{budget}% of full cache</span>
            </div>
            <input type="range" min="5" max="100" step="5" value={budget} onChange={(e) => setBudget(+e.target.value)} style={{ width:'100%', accentColor:'#FF5B22', marginTop:8 }} />
          </div>
          <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
            {['Qwen2.5-3B','Llama-3.2-3B','Qwen2.5-1.5B'].map(m => (
              <button key={m} onClick={() => setModel(m)} style={{
                background: model===m ? '#FF5B22' : 'transparent',
                color: model===m ? '#0F0E0C' : 'rgba(237,227,210,.7)',
                border:'1px solid ' + (model===m ? '#FF5B22' : 'rgba(237,227,210,.18)'),
                padding:'6px 10px', fontSize:10, letterSpacing:1, cursor:'pointer',
                fontFamily:'inherit', fontWeight: model===m ? 700 : 400,
              }}>{m}</button>
            ))}
          </div>
        </div>
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display:'block', maxHeight:260 }}>
          {[5,6,7,8,9].map(v => (
            <g key={v}>
              <line x1={padL} x2={W - padR} y1={y(v)} y2={y(v)} stroke="rgba(237,227,210,.08)" strokeDasharray="2 4" />
              <text x={padL - 8} y={y(v) + 3} textAnchor="end" fontSize="9" fill="rgba(237,227,210,.45)">{v.toFixed(1)}</text>
            </g>
          ))}
          {[10,30,50,70,90].map(b => (
            <text key={b} x={x(b)} y={H - padB + 14} textAnchor="middle" fontSize="9" fill="rgba(237,227,210,.45)">{b}%</text>
          ))}
          <line x1={padL} x2={W - padR} y1={y(ppFull)} y2={y(ppFull)} stroke="rgba(61,245,140,.4)" strokeDasharray="3 3" />
          <text x={W - padR} y={y(ppFull) - 4} textAnchor="end" fontSize="9" fill="#3df58c">full cache · {ppFull.toFixed(2)}</text>
          <path d={path(ys1)} fill="none" stroke="rgba(237,227,210,.55)" strokeWidth="1.5" />
          <path d={path(ys2)} fill="none" stroke="#FF5B22" strokeWidth="2" />
          <line x1={x(budget)} x2={x(budget)} y1={padT} y2={H - padB} stroke="rgba(255,91,34,.25)" strokeDasharray="2 3" />
          <circle cx={x(budget)} cy={y(ppMean)} r="4" fill="rgba(237,227,210,.9)" />
          <circle cx={x(budget)} cy={y(ppMax)} r="4" fill="#FF5B22" />
        </svg>
        <div style={{ display:'flex', gap:24, flexWrap:'wrap', marginTop:14 }}>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <span style={{ width:14, height:2, background:'rgba(237,227,210,.55)' }} />
            <span style={{ fontSize:11, color:'rgba(237,227,210,.7)' }}>mean-agg (H2O baseline)</span>
            <span style={{ fontSize:11, color:'#EDE3D2' }}>{ppMean.toFixed(3)}</span>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <span style={{ width:14, height:2, background:'#FF5B22' }} />
            <span style={{ fontSize:11, color:'rgba(237,227,210,.7)' }}>max-agg (ours)</span>
            <span style={{ fontSize:11, color:'#FF5B22' }}>{ppMax.toFixed(3)}</span>
          </div>
          <div style={{ marginLeft:'auto', fontSize:11 }}>
            <span style={{ color:'rgba(237,227,210,.5)' }}>Δ = </span>
            <span style={{ color: delta > 0 ? '#3df58c' : '#FF5B22', fontWeight:700 }}>
              {delta > 0 ? `−${delta} ppl` : `+${Math.abs(delta)}`}
            </span>
            <span style={{ color:'rgba(237,227,210,.5)' }}> (lower is better)</span>
          </div>
        </div>
      </div>
    );
  };
})();

// glitchy text — vertical chromatic aberration + occasional Y jitter
function GlitchText({ children, size, color = '#EDE3D2' }) {
  const [jit, setJit] = React.useState(0);
  React.useEffect(() => {
    let to;
    const loop = () => {
      to = setTimeout(() => {
        setJit(Math.random() * 5 - 2.5);
        setTimeout(() => setJit(0), 90);
        loop();
      }, 2200 + Math.random() * 4000);
    };
    loop();
    return () => clearTimeout(to);
  }, []);
  return (
    <span style={{
      display:'inline-block',
      transform:`translateY(${jit}px)`,
      fontFamily:'"Instrument Serif",serif', fontStyle:'italic',
      fontSize:size, lineHeight:.92, letterSpacing:-4, color,
      textShadow:`0 -2px #FF5B22, 0 2px #3df58c`,
    }}>{children}</span>
  );
}

            <span style={{ fontFamily:'"JetBrains Mono",monospace', fontSize:10, letterSpacing:2, color:'#FF5B22' }}>№ {w.tag}</span>
            <span style={{ fontFamily:'"JetBrains Mono",monospace', fontSize:9, letterSpacing:2, color:'rgba(237,227,210,.5)', textTransform:'uppercase' }}>{w.tone}</span>
            <span style={{ fontFamily:'"JetBrains Mono",monospace', fontSize:10, color:'rgba(237,227,210,.4)', marginLeft:'auto' }}>{w.dates}</span>
          </div>
          <h3 style={{ margin:0, fontFamily:'"Instrument Serif",serif', fontStyle:'italic', fontSize:48, lineHeight:1, color:'#EDE3D2' }}>{w.title}</h3>
          <p style={{ margin:'8px 0 0', fontFamily:'"JetBrains Mono",monospace', fontSize:13, color:'rgba(237,227,210,.7)' }}>{w.sub}</p>
        </div>
        <div style={{ fontFamily:'"JetBrains Mono",monospace', fontSize:18, color:'#FF5B22', transform: open ? 'rotate(45deg)' : 'rotate(0)', transition:'transform .3s' }}>+</div>
      </div>
      <div style={{ maxHeight: open ? 900 : 0, overflow:'hidden', transition:'max-height .4s ease' }}>
        <p style={{ marginTop:18, marginBottom:18, fontFamily:'"JetBrains Mono",monospace', fontSize:13, lineHeight:1.85, color:'rgba(237,227,210,.85)', maxWidth:820 }}>{w.body}</p>
        {w.stack && w.stack.length > 0 && (
          <div style={{ marginBottom:14 }}>
            <div style={{ fontFamily:'"JetBrains Mono",monospace', fontSize:9, letterSpacing:2.5, color:'rgba(237,227,210,.45)', textTransform:'uppercase', marginBottom:8 }}>stack</div>
            <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
              {w.stack.map(c => (
                <span key={c} style={{ fontFamily:'"JetBrains Mono",monospace', fontSize:10, letterSpacing:.5, padding:'5px 10px', border:'1px solid rgba(237,227,210,.18)', color:'rgba(237,227,210,.85)', background:'rgba(237,227,210,.03)' }}>{c}</span>
              ))}
            </div>
          </div>
        )}
        {w.numbers && w.numbers.length > 0 && (
          <div style={{ marginBottom:14 }}>
            <div style={{ fontFamily:'"JetBrains Mono",monospace', fontSize:9, letterSpacing:2.5, color:'#FF5B22', textTransform:'uppercase', marginBottom:8 }}>by the numbers</div>
            <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
              {w.numbers.map(c => (
                <span key={c} style={{ fontFamily:'"JetBrains Mono",monospace', fontSize:9, letterSpacing:1.5, padding:'4px 10px', border:'1px solid rgba(255,91,34,.4)', color:'#FF5B22', textTransform:'uppercase' }}>{c}</span>
              ))}
            </div>
          </div>
        )}
        {w.links && w.links.length > 0 && (
          <div style={{ display:'flex', gap:18, flexWrap:'wrap', marginTop:6 }}>
            {w.links.map(l => (
              <a key={l.href} href={l.href} target={l.href.startsWith('#') ? undefined : '_blank'} rel={l.href.startsWith('#') ? undefined : 'noreferrer'} onClick={(e) => e.stopPropagation()} style={{
                fontFamily:'"JetBrains Mono",monospace', fontSize:11, letterSpacing:1, color:'#FF5B22',
                textDecoration:'none', borderBottom:'1px solid rgba(255,91,34,.4)', paddingBottom:1,
              }}>{l.label}</a>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function SelectedProjects() {
  return (
    <section id="selected" style={{ padding:'120px 8vw', borderTop:'1px solid rgba(237,227,210,.08)' }}>

        display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(280px, 1fr))', gap:18,
      }}>
        {SELECTED.map(p => (
          <a key={p.title} href={p.href || '#'} target={p.href ? '_blank' : undefined} rel={p.href ? 'noreferrer' : undefined}
             onClick={(e) => { if (!p.href) e.preventDefault(); }}
             style={{
               display:'block', textDecoration:'none', color:'inherit',
               border:'1px solid rgba(237,227,210,.12)', background:'rgba(237,227,210,.02)',
               padding:'20px 22px', transition:'all .25s',
               cursor: p.href ? 'pointer' : 'default',
             }}
             onMouseEnter={(e) => { if (p.href) { e.currentTarget.style.borderColor='rgba(255,91,34,.5)'; e.currentTarget.style.background='rgba(255,91,34,.04)'; } }}
             onMouseLeave={(e) => { e.currentTarget.style.borderColor='rgba(237,227,210,.12)'; e.currentTarget.style.background='rgba(237,227,210,.02)'; }}
          >
            <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', gap:10 }}>
              <h3 style={{ margin:0, fontFamily:'"Instrument Serif",serif', fontStyle:'italic', fontSize:24, lineHeight:1.1, color:'#EDE3D2' }}>{p.title}</h3>
              <span style={{ fontFamily:'"JetBrains Mono",monospace', fontSize:14, color:p.href ? '#FF5B22' : 'rgba(237,227,210,.3)' }}>{p.href ? '↗' : '·'}</span>
            </div>
            <p style={{ margin:'10px 0 0', fontFamily:'"JetBrains Mono",monospace', fontSize:12, lineHeight:1.7, color:'rgba(237,227,210,.7)' }}>{p.desc}</p>
            {p.href && (
              <div style={{ marginTop:10, fontFamily:'"JetBrains Mono",monospace', fontSize:10, letterSpacing:1, color:'rgba(255,91,34,.7)' }}>
                {p.href.replace(/^https?:\/\//, '')}

            )}
          </a>
        ))}
      </div>
    </section>
  );
}

function ResearchSection() {

    <section id="research" style={{ padding:'120px 8vw', borderTop:'1px solid rgba(237,227,210,.08)' }}>

            <div style={{ display:'flex', gap:10, alignItems:'baseline', marginBottom:8, flexWrap:'wrap' }}>
              <span style={{ fontFamily:'"JetBrains Mono",monospace', fontSize:9, letterSpacing:2, padding:'3px 8px', background:colorFor(p.status), color:'#0F0E0C', textTransform:'uppercase' }}>{p.status}</span>
              <span style={{ fontFamily:'"JetBrains Mono",monospace', fontSize:11, color:'rgba(237,227,210,.5)' }}>{p.venue}</span>
